<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektro Bud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <div class="card p-4 w-50 mx-auto mt-5">
        <form id="form" method="POST">
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Add New Product</legend>
            </fieldset>

            <div class="mb-3">
                <label for="eanCodeInput">EAN Code:</label>
                <input type="text" id="eanCodeInput" class="form-control" placeholder="0012345678901" required>
            </div>

            <div class="mb-3">
                <label for="nameInput">Name:</label>
                <input type="text" id="nameInput" class="form-control" placeholder="DisplayPort cable" required>
            </div>

            <div class="mb-3">
                <label for="priceInput">Price ($):</label>
                <input type="number" id="priceInput" class="form-control" placeholder="20 $" required>
            </div>

            <div class="mb-3">
                <label for="costPriceInput">Cost price ($):</label>
                <input type="number" id="costPriceInput" class="form-control" placeholder="15 $" required>
            </div>

            <div class="mb-3">
                <label for="quantityInput">Quantity:</label>
                <input type="number" id="quantityInput" class="form-control" placeholder="1 unit" required>
            </div>

            <div class="mb-3">
                <label for="categorySelect">Category:</label>
                <select id="categorySelect" class="form-control" required>

                </select>
            </div>

            <div class="mb-3">
                <label for="statusSelect">Status:</label>
                <select id="statusSelect" class="form-control" required>

                </select>
            </div>


            <div class="d-flex mb-3">
                <div class="flex-fill mx-2">
                    <label for="sectorInput">Sector:</label>
                    <input type="text" id="sectorInput" class="form-control" placeholder="A/B/C" required>
                </div>
                <div class="flex-fill mx-2">
                    <label for="rackInput">Rack:</label>
                    <input type="text" id="rackInput" class="form-control" placeholder="05" required>
                </div>
                <div class="flex-fill mx-2">
                    <label for="shelfInput">Shelf:</label>
                    <input type="text" id="shelfInput" class="form-control" placeholder="1" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="imageInput">Image:</label>
                <input type="text" id="imageInput" class="form-control" placeholder="Paste image URL" required>
            </div>
            
            <div class="d-flex justify-content-end">
                <button type="submit" class="theme-primary btn-subtle text-end" id="addProductBtn">Add Product</button>
            </div>
        </form>
    </div>

    <div id="tableWrapperDiv" class="mt-10 mx-10">

    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script type="module" src="public/main.js"></script>
</body>
</html>
